<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="174" y1="78" x2="1106" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #F9FAFB; }
      .subtitle { font: 500 19px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #CBD5E1; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #F9FAFB; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #CBD5E1; }
      .tiny { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #94A3B8; }
      .box { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .box2 { fill: #0F172A; stroke: #475569; stroke-width: 1.2; rx: 18; }
      .hot { fill: url(#accent); }
      .line { stroke: #FFB020; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line2 { stroke: #64748B; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 8 10; }
      .pill { fill: #1E293B; stroke: #475569; stroke-width: 1; rx: 13; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#FFB020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="104" r="160" fill="#FF6B35" opacity="0.10"/>
  <circle cx="160" cy="640" r="220" fill="#FFB020" opacity="0.08"/>

  <text x="72" y="76" class="title">Clean Up Aisle Five</text>
  <text x="72" y="110" class="subtitle">A Databricks governance control plane for Unity Catalog hygiene, remediation planning, and operational telemetry.</text>

  <!-- Target catalogs -->
  <rect x="74" y="185" width="220" height="285" class="box"/>
  <text x="104" y="228" class="label">Target catalogs</text>
  <text x="104" y="258" class="small">Business data estate</text>
  <rect x="104" y="296" width="160" height="38" class="pill"/>
  <text x="124" y="320" class="small">finance</text>
  <rect x="104" y="348" width="160" height="38" class="pill"/>
  <text x="124" y="372" class="small">marketing</text>
  <rect x="104" y="400" width="160" height="38" class="pill"/>
  <text x="124" y="424" class="small">supply_chain</text>

  <!-- Scanners -->
  <rect x="365" y="150" width="300" height="355" class="box"/>
  <text x="395" y="193" class="label">Governance jobs</text>
  <text x="395" y="223" class="small">Lakeflow tasks scheduled via DAB</text>
  <rect x="397" y="260" width="236" height="42" class="box2"/>
  <text x="417" y="286" class="small">01 stale assets</text>
  <rect x="397" y="314" width="236" height="42" class="box2"/>
  <text x="417" y="340" class="small">02 required tags</text>
  <rect x="397" y="368" width="236" height="42" class="box2"/>
  <text x="417" y="394" class="small">03 naming drift</text>
  <rect x="397" y="422" width="236" height="42" class="box2"/>
  <text x="417" y="448" class="small">04 metadata + PII enrichment</text>

  <!-- Control plane -->
  <rect x="735" y="135" width="330" height="385" class="box"/>
  <rect x="735" y="135" width="330" height="64" class="hot" rx="22"/>
  <text x="768" y="176" class="label">UC Hygiene control schema</text>
  <text x="768" y="226" class="small">System of record for governance state</text>
  <rect x="768" y="260" width="264" height="38" class="box2"/>
  <text x="788" y="284" class="small">scan_results</text>
  <rect x="768" y="310" width="264" height="38" class="box2"/>
  <text x="788" y="334" class="small">migration_plans + bridge_views</text>
  <rect x="768" y="360" width="264" height="38" class="box2"/>
  <text x="788" y="384" class="small">certification_state</text>
  <rect x="768" y="410" width="264" height="38" class="box2"/>
  <text x="788" y="434" class="small">feature_check_results</text>
  <rect x="768" y="460" width="264" height="38" class="box2"/>
  <text x="788" y="484" class="small">cost + run history</text>

  <!-- Outputs -->
  <rect x="1088" y="184" width="140" height="288" class="box"/>
  <text x="1115" y="226" class="label">Operate</text>
  <text x="1115" y="258" class="small">Dashboards</text>
  <text x="1115" y="288" class="small">Alerts</text>
  <text x="1115" y="318" class="small">Owner email</text>
  <text x="1115" y="348" class="small">Slack</text>
  <text x="1115" y="378" class="small">Jira</text>
  <text x="1115" y="408" class="small">Audits</text>

  <!-- Flow arrows -->
  <path d="M294 327 C322 327 335 327 365 327" class="line" marker-end="url(#arrow)"/>
  <path d="M665 327 C695 327 706 327 735 327" class="line" marker-end="url(#arrow)"/>
  <path d="M1065 327 C1075 327 1079 327 1088 327" class="line" marker-end="url(#arrow)"/>

  <!-- AI/Safety lane -->
  <rect x="244" y="570" width="792" height="78" class="pill"/>
  <text x="276" y="602" class="small">Safety model: monitor first, propose plans, human approves, bridge views preserve compatibility, then measure adoption and cost.</text>
  <text x="276" y="631" class="tiny">Optional AI is narrowly scoped to rename suggestions and metadata descriptions; core risk, priority, and remediation steps stay deterministic.</text>
  <path d="M900 520 C900 552 900 552 900 570" class="line2" marker-end="url(#arrow2)"/>
</svg>
